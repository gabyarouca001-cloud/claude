<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Playfair"; font-style: italic; font-weight: 500; src: url(assets/fonts/PlayfairItalic-500.ttf); }
      @font-face { font-family: "Playfair"; font-style: italic; font-weight: 700; src: url(assets/fonts/PlayfairItalic-700.ttf); }
      @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/Inter-500.ttf); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/Inter-800.ttf); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/Inter-900.ttf); }
      @font-face { font-family: "Rubik"; font-weight: 600; src: url(assets/fonts/Rubik-600.ttf); }
      @font-face { font-family: "Rubik"; font-weight: 900; src: url(assets/fonts/Rubik-900.ttf); }
      :root { --y: #fcedc0; --gold: #f1ce0b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0c0e; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter", sans-serif; color: #fff; }
      .bg { position: absolute; inset: 0;
        background: radial-gradient(1100px 900px at 78% 45%, #26262c 0%, #111114 60%, #0b0b0d 100%); }
      .sh { text-shadow: 0 4px 22px rgba(0, 0, 0, 0.55); }
      .abs { position: absolute; }
      /* S1: lettering principal */
      #echo { left: 0; right: 0; top: 150px; text-align: center; font-weight: 900; font-size: 760px; line-height: 1;
        color: #fff; opacity: 0; letter-spacing: -0.04em; }
      #l1 { left: 0; right: 0; top: 500px; text-align: center; font-family: "Playfair"; font-style: italic; font-weight: 500;
        font-size: 92px; line-height: 1.1; }
      #l1 .w { display: inline-block; margin: 0 0.14em; }
      #l2mask { left: 0; right: 0; top: 614px; height: 220px; overflow: hidden; text-align: center; }
      #l2 { display: block; font-weight: 900; font-size: 188px; line-height: 200px; color: var(--y); letter-spacing: -0.02em;
        white-space: nowrap; }
      #l2 .c { display: inline-block; }
      #ul { left: 410px; top: 838px; }
      /* S2: pessoas */
      #grid { left: 140px; top: 200px; width: 880px; height: 360px; }
      .pessoa { position: absolute; width: 120px; height: 150px; }
      #cnt { left: 140px; top: 600px; font-weight: 900; font-size: 250px; line-height: 1; color: var(--y); letter-spacing: -0.04em; }
      #cntA { left: 720px; top: 668px; font-family: "Playfair"; font-style: italic; font-weight: 500; font-size: 70px; }
      #cntB { left: 720px; top: 760px; font-weight: 900; font-size: 52px; letter-spacing: 0.04em; color: var(--y); }
      #cap { left: 120px; top: 928px; display: flex; align-items: stretch; gap: 22px; }
      #cap .barra { width: 8px; background: var(--y); border-radius: 4px; }
      #cap .k { font-weight: 800; font-size: 22px; letter-spacing: 0.22em; color: var(--y); }
      #cap .t { font-weight: 500; font-size: 44px; margin-top: 4px; }
      /* S3: gráfico */
      #gt { left: 140px; top: 140px; font-family: "Playfair"; font-style: italic; font-weight: 500; font-size: 62px; }
      #gnum { left: 140px; top: 220px; font-weight: 900; font-size: 190px; line-height: 1; color: var(--y); letter-spacing: -0.04em; }
      #gk { left: 150px; top: 430px; font-weight: 800; font-size: 26px; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.7); }
      #chart { left: 120px; top: 480px; width: 940px; height: 520px; }
      /* S4: legendas */
      .leg { left: 0; right: 0; text-align: center; white-space: nowrap; }
      #sub1 { top: 780px; font-family: "Rubik"; font-weight: 600; font-size: 84px; }
      #sub1 .w { display: inline-block; margin: 0 0.16em; text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); }
      #sub1 .key { font-weight: 900; color: var(--y); text-shadow: 0 0 28px rgba(252, 237, 192, 0.55), 0 4px 18px rgba(0, 0, 0, 0.6); }
      #sub2 { opacity: 0; top: 780px; font-family: "Playfair"; font-style: italic; font-weight: 500; font-size: 104px; }
      #sub2 .w { display: inline-block; margin: 0 0.18em; text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); }
      #sub2 .gold { color: var(--gold); font-weight: 700; text-shadow: 0 0 26px rgba(241, 206, 11, 0.5), 0 4px 18px rgba(0, 0, 0, 0.6); }
      #tag { left: 0; right: 0; top: 700px; text-align: center; font-weight: 800; font-size: 22px; letter-spacing: 0.3em; color: rgba(255,255,255,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.4" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <!-- S1: lettering principal -->
      <section id="s1" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
        <div id="echo" class="abs">30%</div>
        <div id="l1" class="abs sh"><span class="w">30%</span><span class="w">dos</span><span class="w">criadores</span></div>
        <div id="l2mask" class="abs"><span id="l2" class="sh">NÃO MONETIZAM</span></div>
        <svg id="ul" class="abs" width="1100" height="20" viewBox="0 0 1100 20">
          <path id="ulp" d="M4 12 C 300 2, 700 18, 1096 8" fill="none" stroke="#fcedc0" stroke-width="7" stroke-linecap="round" pathLength="1"/>
        </svg>
      </section>

      <!-- S2: explicação com pessoas -->
      <section id="s2" class="clip" data-start="3.4" data-duration="4.9" data-track-index="2">
        <div id="grid" class="abs"></div>
        <div id="cnt" class="abs sh">0%</div>
        <div id="cntA" class="abs sh">dos criadores</div>
        <div id="cntB" class="abs sh">NÃO MONETIZAM</div>
        <div id="cap" class="abs"><div class="barra"></div><div><div class="k">CAPÍTULO 02</div><div class="t">Monetização</div></div></div>
      </section>

      <!-- S3: gráfico -->
      <section id="s3" class="clip" data-start="8.1" data-duration="4.4" data-track-index="3">
        <div id="gt" class="abs sh">Alcance ao longo dos meses</div>
        <div id="gnum" class="abs sh">+0%</div>
        <div id="gk" class="abs">EXEMPLO ILUSTRATIVO</div>
        <svg id="chart" class="abs" width="940" height="520" viewBox="0 0 940 520"></svg>
      </section>

      <!-- S4: legendas em 3 estilos -->
      <section id="s4" class="clip" data-start="12.4" data-duration="4.0" data-track-index="4">
        <div id="tag" class="abs">LEGENDAS</div>
        <div id="sub1" class="abs leg"></div>
        <div id="sub2" class="abs leg"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const Y = "#fcedc0";

      // ---------- S1: lettering ----------
      const l2 = document.getElementById("l2");
      const txt = l2.textContent; l2.textContent = "";
      [...txt].forEach((ch) => { const s = document.createElement("span"); s.className = "c"; s.textContent = ch === " " ? " " : ch; l2.appendChild(s); });
      tl.fromTo("#echo", { opacity: 0, scale: 1.18 }, { opacity: 0.07, scale: 1, duration: 1.1, ease: "power3.out" }, 0);
      tl.fromTo("#l1 .w", { y: 54, opacity: 0, filter: "blur(10px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out", stagger: 0.13 }, 0.1);
      tl.fromTo("#l2 .c", { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "expo.out", stagger: 0.035 }, 0.55);
      tl.fromTo("#ulp", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 1.25);
      tl.to(["#l1", "#l2mask", "#ul"], { y: -34, opacity: 0, duration: 0.38, ease: "power2.in", stagger: 0.04 }, 3.1);
      tl.to("#echo", { opacity: 0, scale: 1.06, duration: 0.45, ease: "power2.in" }, 3.1);

      // ---------- S2: pessoas ----------
      const grid = document.getElementById("grid");
      const destaque = [1, 4, 8];
      const pessoas = [];
      for (let i = 0; i < 10; i++) {
        const col = i % 5, lin = Math.floor(i / 5);
        const d = document.createElement("div"); d.className = "pessoa";
        d.style.left = col * 176 + "px"; d.style.top = lin * 180 + "px";
        d.innerHTML = '<svg width="120" height="150" viewBox="0 0 120 150"><circle class="cab" cx="60" cy="36" r="30" fill="#fff"/><path class="cor" d="M8 148 C8 98 34 78 60 78 C86 78 112 98 112 148 Z" fill="#fff"/></svg>';
        grid.appendChild(d); pessoas.push(d);
      }
      tl.fromTo(pessoas, { scale: 0, opacity: 0, transformOrigin: "50% 100%" },
        { scale: 1, opacity: 0.32, duration: 0.5, ease: "back.out(1.8)", stagger: 0.06 }, 3.55);
      const outras = pessoas.filter((_, i) => !destaque.includes(i));
      const alvo = destaque.map((i) => pessoas[i]);
      tl.to(outras, { opacity: 0.12, duration: 0.5, ease: "power2.out" }, 4.75);
      tl.to(alvo, { opacity: 1, scale: 1.1, duration: 0.5, ease: "back.out(2)", stagger: 0.12 }, 4.75);
      alvo.forEach((el) => tl.to(el.querySelectorAll("path,circle"), { fill: Y, duration: 0.45, ease: "none" }, 4.75));
      const c30 = { v: 0 }; const cnt = document.getElementById("cnt");
      tl.fromTo("#cnt", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.8);
      tl.to(c30, { v: 30, duration: 1.1, ease: "power2.out", onUpdate: () => (cnt.textContent = Math.round(c30.v) + "%") }, 4.8);
      tl.fromTo("#cntA", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 5.35);
      tl.fromTo("#cntB", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, 5.6);
      tl.fromTo("#cap", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 4.0);
      tl.to(["#grid", "#cnt", "#cntA", "#cntB", "#cap"], { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", stagger: 0.03 }, 7.8);

      // ---------- S3: gráfico ----------
      const dados = [10, 16, 14, 26, 38, 62], W = 940, H = 520, pad = 36;
      const pts = dados.map((v, i) => [pad + (i * (W - 2 * pad)) / (dados.length - 1), H - pad - (v / 70) * (H - 2 * pad)]);
      const svg = document.getElementById("chart");
      const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
      for (let g = 0; g < 5; g++) { const yy = pad + (g * (H - 2 * pad)) / 4; mk("line", { x1: pad, x2: W - pad, y1: yy, y2: yy, stroke: "rgba(255,255,255,0.14)", "stroke-width": 2 }); }
      let d = "M" + pts[0][0] + " " + pts[0][1];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
        d += " C" + (p1[0] + (p2[0] - p0[0]) / 6) + " " + (p1[1] + (p2[1] - p0[1]) / 6) + "," + (p2[0] - (p3[0] - p1[0]) / 6) + " " + (p2[1] - (p3[1] - p1[1]) / 6) + "," + p2[0] + " " + p2[1];
      }
      const area = mk("path", { d: d + " L" + pts[pts.length - 1][0] + " " + (H - pad) + " L" + pts[0][0] + " " + (H - pad) + " Z", fill: "rgba(252,237,192,0.13)", opacity: 0 });
      const linha = mk("path", { d, fill: "none", stroke: Y, "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1 });
      const halo = mk("circle", { r: 26, fill: "rgba(252,237,192,0.25)", opacity: 0 });
      const ponto = mk("circle", { r: 14, fill: Y, opacity: 0 });
      const total = linha.getTotalLength(), amostras = [];
      for (let i = 0; i <= 160; i++) { const p = linha.getPointAtLength((total * i) / 160); amostras.push([p.x, p.y]); }
      const prog = { p: 0 }, gnum = document.getElementById("gnum");
      const mover = () => {
        const a = amostras[Math.min(160, Math.round(prog.p * 160))];
        ponto.setAttribute("cx", a[0]); ponto.setAttribute("cy", a[1]); halo.setAttribute("cx", a[0]); halo.setAttribute("cy", a[1]);
        gnum.textContent = "+" + Math.round(prog.p * 340) + "%";
      };
      tl.fromTo("#gt", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 8.2);
      tl.fromTo(["#gnum", "#gk"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.1 }, 8.35);
      tl.fromTo(svg.querySelectorAll("line"), { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.06 }, 8.3);
      tl.fromTo(linha, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.3, ease: "power2.inOut" }, 8.75);
      tl.to([ponto, halo], { opacity: 1, duration: 0.2 }, 8.75);
      tl.to(prog, { p: 1, duration: 2.3, ease: "power2.inOut", onUpdate: mover }, 8.75);
      tl.to(area, { opacity: 1, duration: 0.8, ease: "power2.out" }, 10.2);
      tl.fromTo(halo, { attr: { r: 26 } }, { attr: { r: 44 }, opacity: 0.0, duration: 0.7, ease: "power2.out" }, 11.05);
      tl.to(["#gt", "#gnum", "#gk", "#chart"], { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", stagger: 0.03 }, 12.1);

      // ---------- S4: legendas ----------
      const monta = (el, palavras, cls) => palavras.forEach(([t, k]) => { const s = document.createElement("span"); s.className = "w " + (k ? cls : ""); s.textContent = t; el.appendChild(s); });
      const sub1 = document.getElementById("sub1"), sub2 = document.getElementById("sub2");
      monta(sub1, [["e", 0], ["é", 0], ["aqui", 0], ["que", 0]], "key");
      monta(sub2, [["isso", 0], ["muda", 0], ["tudo", 1]], "gold");
      const w1 = sub1.querySelectorAll(".w"), w2 = sub2.querySelectorAll(".w");
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.45);
      tl.fromTo(w1, { opacity: 0, y: 22, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2.2)", stagger: 0.22 }, 12.6);
      tl.set(sub1, { opacity: 1 }, 12.6);
      tl.to(sub1, { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, 13.75);
      // 2º trecho: palavra-chave amarela Rubik Black
      tl.call(() => {}, null, 13.75);
      tl.to("#sub2", { opacity: 1, duration: 0.01 }, 14.2);
      tl.fromTo(w2, { opacity: 0, y: 26, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(2)", stagger: 0.3, immediateRender: false }, 14.2);
      tl.to(w2[2], { scale: 1.12, duration: 0.22, ease: "power2.out" }, 15.05);
      tl.to("#sub2", { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, 16.05);
      tl.to("#tag", { opacity: 0, duration: 0.25 }, 16.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
